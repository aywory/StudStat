<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учёт работ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%23212121'/%3E%3Cpath d='M7 16v-3m5 3V9m5 7V6' stroke='%23dfbd70' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
    rel="stylesheet">


  <!-- ══ Themes — load ALL, active one activates via :root[data-theme] ══ -->
  <link rel="stylesheet" href="css/themes/dark_theme.css">
  <link rel="stylesheet" href="css/themes/white_theme.css">
  <link rel="stylesheet" href="css/themes/glassmorphism.css">
  <link rel="stylesheet" href="css/themes/agate-slice.css">
  <link rel="stylesheet" href="css/themes/bioluminescent-bay.css">
  <link rel="stylesheet" href="css/themes/bioluminescent-bay-premium.css">
  <link rel="stylesheet" href="css/themes/cave-painting.css">
  <link rel="stylesheet" href="css/themes/cracked-salt-flats.css">
  <link rel="stylesheet" href="css/themes/wabi-sabi-clay.css">
  <!-- Add new themes here as <link> tags, then register in app.js EXTRA_THEMES -->

  <!-- Base styles (order matters) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/reports.css">
</head>

<body>

  <!-- ══ File prompt — content injected by app.js ══ -->
  <div id="file-prompt" style="display:none"></div>

  <!-- ══ App shell ══ -->
  <div id="app">
    <aside id="sidebar">
      <nav id="navigation" aria-label="Основное меню"></nav>
      <div id="app-controls"></div>
    </aside>
    <div id="workspace-toolbar" class="workspace-toolbar">
      <div id="workspace-title"></div>
      <div id="workspace-filters"></div>
      <div class="wordmark"><span class="brand-mark" aria-hidden="true"></span>StudStat</div>
    </div>
    <main id="main"></main>
  </div>

  <!-- ══ Toast container ══ -->
  <div id="toast-container"></div>

  <!-- ══ JS modules ══ -->
  <script src="js/statistics.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-records.js"></script>
  <script src="js/view-analytics.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
